<title>Control Room Replay</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root {
    --bg:        #0B0D10;
    --panel:     #111419;
    --panel-2:   #161A20;
    --rule:      #232830;
    --rule-soft: #1A1E25;
    --ink:       #E6E9ED;
    --ink-mute:  #8A93A0;
    --ink-faint: #5C6470;
    --allow:     #4ADE80;
    --deny:      #F87171;
    --ask:       #FBBF24;
    --auto:      #5C6470;
    --accent:    #7DD3FC;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
    font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }
  .lbl {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-faint);
  }
  .shell { max-width: 1180px; margin: 0 auto; padding: 28px 22px 64px; display: flex; flex-direction: column; gap: 20px; }

  /* header */
  header { display: flex; flex-direction: column; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -.01em; }
  .chip {
    font-family: "IBM Plex Mono", monospace; font-size: 10px; letter-spacing: .1em;
    padding: 2px 7px; border: 1px solid var(--rule); border-radius: 3px; color: var(--ink-mute);
  }
  .chip[data-tone="replay"] { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
  .task {
    background: var(--panel); border: 1px solid var(--rule); border-left: 2px solid var(--accent);
    border-radius: 3px; padding: 12px 15px; color: var(--ink-mute); font-size: 13px;
    max-width: 80ch;
  }
  .task b { color: var(--ink); font-weight: 500; }

  /* timeline */
  .tl-wrap { display: flex; flex-direction: column; gap: 9px; }
  .tl {
    position: relative; height: 54px; background: var(--panel); border: 1px solid var(--rule);
    border-radius: 3px; cursor: pointer; overflow: hidden;
  }
  .tl-band { position: absolute; top: 0; height: 100%; }
  .tl-band[data-kind="wait"] { background: color-mix(in srgb, var(--ask) 14%, transparent); }
  .tl-band[data-kind="run"]  { background: color-mix(in srgb, var(--allow) 8%, transparent); }
  .tl-mark { position: absolute; top: 0; width: 2px; height: 100%; }
  .tl-mark[data-d="allow"] { background: var(--allow); }
  .tl-mark[data-d="deny"]  { background: var(--deny); }
  .tl-mark[data-d="undo"]  { background: var(--accent); }
  .tl-head {
    position: absolute; top: 0; width: 1px; height: 100%; background: var(--ink);
    pointer-events: none;
  }
  .tl-head::after {
    content: ""; position: absolute; top: -3px; left: -3px; width: 7px; height: 7px;
    background: var(--ink); border-radius: 50%;
  }
  .tl-legend { display: flex; flex-wrap: wrap; gap: 6px 18px; }
  .tl-legend span { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--ink-mute); }
  .dot { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }

  /* controls */
  .ctrls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  button {
    font-family: inherit; font-size: 13px; color: var(--ink); background: var(--panel-2);
    border: 1px solid var(--rule); border-radius: 3px; padding: 6px 13px; cursor: pointer;
  }
  button:hover { background: var(--rule); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button[data-primary] { background: var(--ink); color: var(--bg); border-color: var(--ink); font-weight: 500; }
  button[data-primary]:hover { background: #fff; }
  .clock { font-size: 13px; color: var(--ink-mute); font-variant-numeric: tabular-nums; }

  /* body grid */
  .grid { display: grid; grid-template-columns: 1fr 340px; gap: 16px; align-items: start; }
  .panel { background: var(--panel); border: 1px solid var(--rule); border-radius: 3px; }
  .panel-h { padding: 11px 15px; border-bottom: 1px solid var(--rule-soft); display: flex; justify-content: space-between; align-items: center; }

  /* stream */
  #stream { max-height: 460px; overflow-y: auto; padding: 4px 0; }
  .ev { display: grid; grid-template-columns: 50px 1fr; gap: 12px; padding: 7px 15px; border-bottom: 1px solid var(--rule-soft); }
  .ev:last-child { border-bottom: none; }
  .ev-t { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--ink-faint); font-variant-numeric: tabular-nums; padding-top: 2px; }
  .ev-b { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .ev-title { font-size: 13px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .ev-sub { font-family: "IBM Plex Mono", monospace; font-size: 11.5px; color: var(--ink-mute); word-break: break-word; }
  .tag {
    font-family: "IBM Plex Mono", monospace; font-size: 10px; letter-spacing: .08em; text-transform: uppercase;
    padding: 1px 6px; border-radius: 2px; border: 1px solid;
  }
  .tag[data-k="ask"]   { color: var(--ask);   border-color: color-mix(in srgb, var(--ask) 40%, transparent); }
  .tag[data-k="allow"] { color: var(--allow); border-color: color-mix(in srgb, var(--allow) 40%, transparent); }
  .tag[data-k="deny"]  { color: var(--deny);  border-color: color-mix(in srgb, var(--deny) 40%, transparent); }
  .tag[data-k="auto"]  { color: var(--auto);  border-color: var(--rule); }
  .tag[data-k="info"]  { color: var(--accent);border-color: color-mix(in srgb, var(--accent) 40%, transparent); }

  /* pending */
  #pending { padding: 15px; display: flex; flex-direction: column; gap: 12px; min-height: 150px; }
  .idle { color: var(--ink-faint); font-size: 13px; }
  .req { display: flex; flex-direction: column; gap: 5px; }
  .req-cmd {
    font-family: "IBM Plex Mono", monospace; font-size: 12px; background: var(--bg);
    border: 1px solid var(--rule); border-radius: 3px; padding: 9px 11px; color: var(--ink);
    word-break: break-all; max-height: 110px; overflow-y: auto;
  }
  .waiting { font-size: 12px; color: var(--ask); font-variant-numeric: tabular-nums; }
  .fake-btns { display: flex; gap: 7px; }
  .fake-btns span {
    font-size: 12px; padding: 5px 11px; border: 1px solid var(--rule); border-radius: 3px; color: var(--ink-faint);
  }
  .fake-btns span[data-hot="allow"] { color: var(--allow); border-color: color-mix(in srgb, var(--allow) 45%, transparent); }
  .fake-btns span[data-hot="deny"]  { color: var(--deny);  border-color: color-mix(in srgb, var(--deny) 45%, transparent); }

  /* stats */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 1px; background: var(--rule-soft); border: 1px solid var(--rule); border-radius: 3px; overflow: hidden; }
  .stat { background: var(--panel); padding: 13px 15px; display: flex; flex-direction: column; gap: 3px; }
  .stat-v { font-family: "IBM Plex Mono", monospace; font-size: 19px; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .stat-v[data-tone="ask"] { color: var(--ask); }
  .stat-v[data-tone="deny"] { color: var(--deny); }

  .note { color: var(--ink-mute); font-size: 13px; max-width: 76ch; }
  .note b { color: var(--ink); font-weight: 500; }

  @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="shell">

  <header>
    <div class="brand">
      <h1>Control Room</h1>
      <span class="chip" data-tone="replay">REPLAY</span>
      <span class="chip mono" id="sessName">—</span>
      <span class="chip mono" id="sessModel">—</span>
    </div>
    <div class="task"><b>Task given to the agent:</b> <span id="taskText">—</span></div>
  </header>

  <div class="tl-wrap">
    <div class="tl" id="tl" role="slider" tabindex="0" aria-label="Session timeline" aria-valuemin="0" aria-valuenow="0">
      <div class="tl-head" id="head" style="left:0"></div>
    </div>
    <div class="tl-legend">
      <span><i class="dot" style="background:color-mix(in srgb,var(--ask) 40%,transparent)"></i> agent blocked, waiting for a human</span>
      <span><i class="dot" style="background:var(--allow)"></i> allowed</span>
      <span><i class="dot" style="background:var(--deny)"></i> denied</span>
      <span><i class="dot" style="background:var(--accent)"></i> undo</span>
    </div>
  </div>

  <div class="ctrls">
    <button data-primary id="play">Play</button>
    <button id="restart">Restart</button>
    <button id="speed">1&times;</button>
    <span class="clock mono" id="clock">0.0s / 0.0s</span>
  </div>

  <div class="grid">
    <div class="panel">
      <div class="panel-h"><span class="lbl">Session log</span><span class="lbl" id="evCount">0 events</span></div>
      <div id="stream"></div>
    </div>
    <div class="panel">
      <div class="panel-h"><span class="lbl">Needs you</span></div>
      <div id="pending"><div class="idle">Nothing waiting.</div></div>
    </div>
  </div>

  <div class="stats" id="stats"></div>

  <p class="note" id="finding"></p>

</div>

      return { title: `Agent wants to use <b>${e.tool}</b>`, sub: i.command || i.file_path || JSON.stringify(i).slice(0, 120) };
    }
    case "ask": return { title: `${T("ask","held")} <b>${e.tool}</b> needs your decision`, sub: `${e.key} — ${e.reason}` };
    case "decision": {
      const human = e.waitedMs != null;
      const k = e.decision === "deny" ? "deny" : (human ? "allow" : "auto");
      const label = human ? `${e.decision} after ${(e.waitedMs/1000).toFixed(1)}s` : `auto-${e.decision}`;
      return { title: `${T(k, label)} <b>${e.tool}</b>`, sub: e.why || "" };
    }
    case "post_tool": return { title: `<b>${e.tool}</b> finished`, sub: `${e.duration_ms}ms` };
    case "tool_result": return e.is_error
      ? { title: `${T("deny","blocked")} Tool returned an error`, sub: String(e.content).slice(0, 140) }
      : { title: `Result`, sub: String(e.content).replace(/\s+/g, " ").slice(0, 140) };
    case "text": return { title: `Agent replies`, sub: String(e.text).replace(/\s+/g, " ").slice(0, 220) };
    case "checkpoint": return { title: `${T("info","checkpoint")} Turn committed`, sub: `${String(e.sha).slice(0,8)} — ${e.msg}` };
    case "result": return { title: `${T("info","done")} Run complete`, sub: `${e.num_turns} turns · $${(e.cost_usd||0).toFixed(4)} · ${(e.denials||[]).length} denial(s)` };
    case "undo": return { title: `${T("info","undo")} Turn reverted`, sub: `${String(e.from).slice(0,8)} → ${String(e.to).slice(0,8)}` };
    case "rate_limit": return null;
    default: return { title: e.type, sub: "" };
  }
}

// ---- playback
let playing = false, cur = 0, speed = 1, raf = null, last = 0;
const stream = $("stream");

function renderTo(time) {
  stream.innerHTML = "";
  let n = 0;
  for (const e of EVENTS) {
    if (rel(e) > time) break;
    const d = describe(e);
    if (!d) continue;
    n++;
    const row = document.createElement("div");
    row.className = "ev";
    row.innerHTML = `<div class="ev-t">${fmt(rel(e))}</div><div class="ev-b"><div class="ev-title">${d.title}</div>${d.sub ? `<div class="ev-sub">${escapeHtml(d.sub)}</div>` : ""}</div>`;
    stream.appendChild(row);
  }
  stream.scrollTop = stream.scrollHeight;
  $("evCount").textContent = n + " events";

  // pending panel
  const open = waits.find(w => time >= w.from && time < w.to);
  const p = $("pending");
  if (open) {
    const i = open.ask.input || {};
    p.innerHTML = `<div class="req">
        <div class="lbl">${open.ask.tool} · ${open.ask.key}</div>
        <div class="req-cmd">${escapeHtml(i.command || i.file_path || JSON.stringify(i))}</div>
      </div>
      <div class="waiting">waiting ${ (time - open.from).toFixed(1) }s…</div>
      <div class="fake-btns">
        <span data-hot="allow">Allow once</span><span>Allow always</span><span data-hot="deny">Deny</span>
      </div>`;
  } else {
    p.innerHTML = `<div class="idle">Nothing waiting. Tools on the “log” tier run without asking.</div>`;
  }

  $("head").style.left = (Math.min(time, DUR) / DUR * 100) + "%";
  $("clock").textContent = `${fmt(Math.min(time, DUR))} / ${fmt(DUR)}`;
  tl.setAttribute("aria-valuenow", Math.round(Math.min(time, DUR)));
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
}

function tick(ts) {
  if (!playing) return;
  if (!last) last = ts;
  cur += (ts - last) / 1000 * speed;
  last = ts;
  if (cur >= DUR) { cur = DUR; pause(); }
  renderTo(cur);
  if (playing) raf = requestAnimationFrame(tick);
}
function play() { if (cur >= DUR) cur = 0; playing = true; last = 0; $("play").textContent = "Pause"; raf = requestAnimationFrame(tick); }
function pause() { playing = false; $("play").textContent = "Play"; if (raf) cancelAnimationFrame(raf); }

$("play").onclick = () => playing ? pause() : play();
$("restart").onclick = () => { cur = 0; renderTo(0); if (!playing) play(); };
$("speed").onclick = () => { speed = speed === 1 ? 2 : speed === 2 ? 4 : 1; $("speed").textContent = speed + "×"; };
tl.onclick = ev => { const r = tl.getBoundingClientRect(); cur = (ev.clientX - r.left) / r.width * DUR; renderTo(cur); };
tl.onkeydown = ev => {
  if (ev.key === "ArrowRight") { cur = Math.min(DUR, cur + 1); renderTo(cur); ev.preventDefault(); }
  if (ev.key === "ArrowLeft")  { cur = Math.max(0, cur - 1);   renderTo(cur); ev.preventDefault(); }
};

// ---- stats
const result = EVENTS.find(e => e.type === "result");
const denyCount = decisions.filter(d => d.decision === "deny").length;
const pct = Math.round(humanWaitMs / 1000 / DUR * 100);
$("stats").innerHTML = [
  ["Session length", fmt(DUR), ""],
  ["Waiting on a human", (humanWaitMs/1000).toFixed(1) + "s", "ask"],
  ["Share of session", pct + "%", "ask"],
  ["Decisions asked", String(decisions.filter(d => d.waitedMs != null).length), ""],
  ["Denied", String(denyCount), denyCount ? "deny" : ""],
  ["Cost", "$" + (result?.cost_usd ?? 0).toFixed(4), ""],
].map(([k, v, tone]) => `<div class="stat"><span class="lbl">${k}</span><span class="stat-v" ${tone?`data-tone="${tone}"`:""}>${v}</span></div>`).join("");

$("finding").innerHTML = `<b>The finding:</b> the agent spent ${(humanWaitMs/1000).toFixed(1)} of ${DUR.toFixed(1)} seconds — ${pct}% of the run — frozen, waiting for a person to answer. Consent is not free. Every tier moved from “ask” to “log” buys speed and spends safety, and this is the surface where you can see the exchange rate.`;

renderTo(0);
</script>
